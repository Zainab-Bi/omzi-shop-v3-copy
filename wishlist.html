<!DOCTYPE html>
<html>
<head>
    <title>My Wishlist</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <h2>My Wishlist ❤️</h2>
    <a href="index.html">🏠 Home</a>
    <a href="shop.html">🛍️ Shop</a>
    <span id="cart-count"></span>
</nav>

<h2 class="section-title">Saved Items</h2>

<div class="products" id="wishlist"></div>

<script>

function loadWishlist() {
    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

    let container = document.getElementById("wishlist");
    container.innerHTML = "";

    if (wishlist.length === 0) {
        container.innerHTML = "<p>No items in wishlist ❤️</p>";
        return;
    }

    wishlist.forEach((product, index) => {

        const div = document.createElement("div");
        div.classList.add("product");

        div.innerHTML = `
            <h3>${product.name}</h3>

            <img src="${product.image}" width="150">

            <p>₹${product.price}</p>

            <button onclick="removeItem(${index})">Remove ❌</button>
        `;

        container.appendChild(div);
    });
}

function removeItem(index) {
    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

    wishlist.splice(index, 1);

    localStorage.setItem("wishlist", JSON.stringify(wishlist));

    loadWishlist();
}

loadWishlist();

</script>
<script src="script.js"></script>
<div id="toast">Added to cart ✔️</div>
</body>
</html>
