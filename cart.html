<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Omzi Cart</title>

<style>
body {
    font-family: Arial;
    padding: 20px;
    background: #f9f9f9;
}

.cart-item {
    display: flex;
    align-items: center;
    background: white;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
}

.cart-item img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    margin-right: 10px;
}

.qty-box {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
}

button {
    padding: 6px 10px;
    cursor: pointer;
}

.qty-btn {
    background: black;
    color: white;
    border: none;
}

.remove-btn {
    background: red;
    color: white;
    border: none;
}

#checkout-btn {
    background: green;
    color: white;
    border: none;
    margin-top: 10px;
}

#clear-btn {
    background: black;
    color: white;
    border: none;
    margin-top: 10px;
}
</style>
</head>

<body>

<h1>Your Cart 🛒</h1>

<div id="cart-items"></div>

<h3>Total: ₹<span id="total">0</span></h3>

<span id="cart-count">0</span>
<button id="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
<button id="clear-btn" onclick="clearCart()">Clear Cart</button>

<script src="js/cart.js"></script>

<div id="toast">Added to cart ✔️</div>

<script src="js/cart.js"></script>

<script>
window.addEventListener("pageshow", function () {
    location.reload();
});
</script>

<div id="toast">Added to cart ✔️</div>

</body>
</html>
