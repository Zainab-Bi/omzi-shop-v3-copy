<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seller Panel</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    input {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 300px;
    }

    button {
      padding: 10px 20px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }

    /* PRODUCT GRID */
    #product-list {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .product {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 10px;
    }

    .product img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product button {
      margin: 5px 3px;
      padding: 5px;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:#111;color:white;">
  <h2>Seller Panel</h2>

  <div>
    <a href="index.html" style="color:white;margin-right:10px;">Home</a>
    <a href="shop.html" style="color:white;margin-right:10px;">Shop</a>
    <a href="seller.html" style="color:white;">Seller</a>
  </div>
</nav>

<h2>Add Product</h2>

<input type="text" id="name" placeholder="Product Name">
<input type="text" id="price" placeholder="Price">
<input type="text" id="discount" placeholder="Discount %">
<input type="text" id="image" placeholder="Image URL">


<button onclick="addProduct()">Add Product</button>

<!-- 🔥 THIS WAS MISSING (VERY IMPORTANT) -->
<div id="product-list"></div>

<script src="./js/seller.js"></script>

<script>
window.addEventListener("DOMContentLoaded", () => {
  const user = JSON.parse(localStorage.getItem("currentUser"));

  if (!user || user.role !== "admin") {
    alert("Access denied! Admins only.");
    window.location.href = "index.html";
  }
});
</script> 

</body>
</html>
